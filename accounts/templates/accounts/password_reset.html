{% extends 'base_full.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm bg-white p-4">
                <h3 class="fw-bold mb-3">Forgot Password?</h3>
                <p class="text-muted small">Enter your email address below, and we'll send you instructions to reset your password.</p>
                
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100 mt-3">Send Reset Link</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

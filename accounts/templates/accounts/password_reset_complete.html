{% extends 'base_full.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 text-center">
                    <h3 class="mb-3 text-success fw-bold">Password Reset Successful!</h3>
                    <p class="text-muted mb-4">Your password has been successfully changed. You can now log in using your new credentials.</p>
                    <a href="{% url 'accounts:login' %}" class="btn btn-primary w-100">Proceed to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

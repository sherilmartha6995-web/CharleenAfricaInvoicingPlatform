<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charleen Africa Invoicing Platform</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: #0d8ef1;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
        }

        .sidebar {
            height: 100vh;
            background-color: #7890e7;
            color: white;
            padding-top: 20px;
            font-family: Tahoma, sans-serif;
            border-right: 1px solid #059ad0;
            position: fixed;
            top: 0;
            left: 0;
            width: 16.666667%;
            overflow-y: auto;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 12px 25px;
            font-weight: 500;
            transition: all 0.2s ease;
            border-left: 4px solid transparent;
        }

        .sidebar a:hover {
            background-color: #c7c1c1;
            color: #239550;
        }

        .sidebar a.active {
            background-color: #2a2a2a;
            color: #0c7918;
            border-left: 4px solid #d4dbd7;
            font-weight: 600;
        }

        .content-area {
            height: 100vh;
            overflow-y: auto;
            background-color: #f8f9fa;
            color: #333333;
            margin-left: 16.666667%;
        }
        
        .style-title {
            font-size: 18px;
            font-weight: bold;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="container-fluid vh-100 p-0">
        <div class="row g-0 h-100">
            
            <div class="col-md-2 sidebar p-0">
                <h4 class="text-center py-2 px-3 style-title">
                    Charleen Africa Invoicing Platform
                </h4>
                <hr style="border-color: #333; margin-top: 20px; margin-bottom: 20px;">
                
                <a href="#" class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
                    Dashboard
                </a>
                <a href="{% url 'customer_list' %}" class="{% if request.resolver_match.url_name == 'customer_list' %}active{% endif %}">
                    Customers
                </a>
                <a href="{% url 'product_list' %}" class="{% if request.resolver_match.url_name == 'product_list' %}active{% endif %}">
                    Products
                </a>
                <a href="{% url 'invoice_list' %}" class="{% if request.resolver_match.url_name == 'invoice_list' %}active{% endif %}">
                    Invoices
                </a>
                <a href="#" class="{% if request.resolver_match.url_name == 'payment_list' %}active{% endif %}">
                    Payments
                </a>
                <a href="#" class="{% if request.resolver_match.url_name == 'credit_notes' %}active{% endif %}">
                    Credit Notes
                </a>
                <a href="#" class="{% if request.resolver_match.url_name == 'debit_notes' %}active{% endif %}">
                    Debit Notes
                </a>
            </div>

            <div class="col-md-10 content-area p-4">
                {% block content %}
                {% endblock content %}
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

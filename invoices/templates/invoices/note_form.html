{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <h2 class="h4 text-primary fw-bold mb-3">{{ title }}</h2>
            <p class="text-muted">Generating adjustment note for Invoice <strong>{{ invoice.invoice_number }}</strong></p>
            
            <form method="POST">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label fw-bold">Reason</label>
                    {{ form.reason }}
                </div>
                
                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Subtotal</label>
                        {{ form.subtotal }}
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Tax Amount</label>
                        {{ form.tax_amount }}
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Total Amount</label>
                        {{ form.total_amount }}
                    </div>
                </div>
                
                <div class="d-flex justify-content-between">
                    <a href="{% url 'invoices:invoice_list' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                    <button type="submit" class="btn btn-success px-4">Save Note</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h3 class="card-title">Pay Invoice #{{ invoice.invoice_number }}</h3>
                    <p>Amount Due: <strong>KES {{ invoice.total_amount }}</strong></p>
                    
                    <form method="POST" id="payment-form">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="phone" class="form-label">M-Pesa Number</label>
                            <input type="tel" name="phone" id="phone" class="form-control"  required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Pay Now</button>
                    </form>
                    
                    <div id="status-message" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('payment-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const statusDiv = document.getElementById('status-message');
        
        statusDiv.innerHTML = '<div class="alert alert-info">Initiating payment... Please check your phone.</div>';
        
        const response = await fetch(window.location.href, {
            method: 'POST',
            body: formData,
            headers: { 'X-CSRFToken': '{{ csrf_token }}' }
        });
        
        const data = await response.json();
    });
</script>
{% endblock %}

{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h3 class="card-title">Pay Invoice #{{ invoice.invoice_number }}</h3>
                    <p>Amount Due: <strong>KES {{ invoice.total_amount }}</strong></p>
                    
                    <form method="POST" id="payment-form">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="amount" class="form-label">Amount to Pay (KES)</label>
    <input type="number" step="0.01" name="amount" id="amount" class="form-control" 
           value="{{ invoice.remaining_balance }}" max="{{ invoice.remaining_balance }}" required>
    <small class="text-muted">Remaining Balance: {{ invoice.remaining_balance }}</small>
</div>
                            <label for="phone" class="form-label">M-Pesa Number</label>
                            <input type="tel" name="phone" id="phone" class="form-control"  required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Pay Now</button>
                    </form>
                    
                    <div id="status-message" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
   document.getElementById('payment-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const statusDiv = document.getElementById('status-message');
    const form = e.target;
    const formData = new FormData(form);
    
    statusDiv.innerHTML = '<div class="alert alert-info">Initiating payment...</div>';
    
    try {
        const response = await fetch(window.location.href, {
            method: 'POST',
            body: formData,
            headers: {
                X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
            }
        });

        const data = await response.json();

        if (response.ok) {
            statusDiv.innerHTML = <div class="alert alert-success">Payment initiated successfully!</div>;
            form.reset();
        } else {
            
            statusDiv.innerHTML = <div class="alert alert-danger">Error: ${data.error || 'Payment failed. Please try again.'}</div>;
        }
    } catch (error) {
        statusDiv.innerHTML = '<div class="alert alert-danger">A system error occurred. Please try again later.</div>';
        console.error('Payment error:', error);
    }
});
</script>
{% endblock %}
